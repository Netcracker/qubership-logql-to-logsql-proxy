services:
  logql-proxy:
    build: .
    ports:
      - "3100:3100"
    environment:
      PROXY_VLOGS_URL: http://victorialogs:9428
      PROXY_LIMITS_MAXMEMORYMB: "512"
    depends_on:
      - victorialogs
    restart: unless-stopped

  victorialogs:
    image: victoriametrics/victoria-logs:latest@sha256:ee4e820cac3721f5f5d91641b950c22439593adc4224f9655e5333d5a84c1dfe
    ports:
      - "9428:9428"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    ports:
      - "3000:3000"
    environment:
      GF_FEATURE_TOGGLES_ENABLE: "logsExplore"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    depends_on:
      - logql-proxy
    restart: unless-stopped

volumes:
  grafana-data: {}
